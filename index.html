<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Busje</title>
<meta name="description" content="Eén tik en je weet welke bus je in Leuven moet nemen.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Busje">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>
:root {
  --bg: #f6f4ef; --card: #ffffff; --ink: #1c1b18; --muted: #6a675f;
  --line: #e2ded4; --accent: #0f6b5c; --accent-ink: #ffffff; --warn: #a8481a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --card: #1f2226; --ink: #f1efe9; --muted: #a09d94;
    --line: #33373d; --accent: #46c2ab; --accent-ink: #0b1f1b; --warn: #f0a070;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
main {
  max-width: 480px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
}
h1 { font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -.02em; }
h2 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 600; }
p { margin: 0; }
#status { margin-top: 4px; color: var(--muted); min-height: 22px; }
section { margin-top: 24px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
button { font: inherit; color: inherit; }
.link { background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 600; cursor: pointer; }
.seg { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg button {
  padding: 9px 14px; border-radius: 10px; cursor: pointer; font-weight: 600;
  background: var(--card); border: 1px solid var(--line);
}
.seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg input { width: 118px; margin: 0; padding: 8px 10px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  position: relative; min-height: 76px; padding: 12px; border-radius: 14px; cursor: pointer;
  background: var(--card); border: 1px solid var(--line);
  font-size: 18px; font-weight: 650; text-align: left; overflow-wrap: anywhere;
}
.tile:active { transform: scale(.98); }
.tile.busy { border-color: var(--accent); }
.tile.add { color: var(--accent); border-style: dashed; background: transparent; }
.tile .x { position: absolute; top: 8px; right: 10px; color: var(--warn); font-size: 15px; }
.free { margin-top: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.big { display: flex; align-items: center; gap: 12px; margin: 8px 0 10px; }
.leave { font-size: 26px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; }
.chip {
  display: inline-block; min-width: 34px; padding: 3px 8px; border-radius: 8px; text-align: center;
  font-weight: 700; background: var(--accent); color: var(--accent-ink); flex: none;
}
.big .chip { font-size: 24px; min-width: 52px; padding: 6px 10px; border-radius: 10px; }
.stop { font-size: 18px; font-weight: 650; overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 0; }
.links a {
  flex: 1 1 30%; padding: 10px 6px; font-size: 14px; border-radius: 10px; text-align: center; text-decoration: none; font-weight: 600;
  color: var(--accent); border: 1px solid var(--accent);
}
.note { color: var(--muted); font-size: 14px; }
.flag { color: var(--warn); font-weight: 600; margin-top: 8px; }
.alts { margin-top: 14px; }
.alt { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.updated { margin-top: 12px; }
.deps { list-style: none; margin: 0; padding: 0; }
.dep { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
a.dep { color: inherit; text-decoration: none; }
.dep .to { font-weight: 600; overflow-wrap: anywhere; }
.dep .when { font-weight: 700; white-space: nowrap; }
.dep .note { grid-column: 2 / 4; }
footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
dialog {
  width: min(440px, calc(100vw - 32px)); max-height: 80vh; border: 1px solid var(--line);
  margin: calc(env(safe-area-inset-top) + 12px) auto auto;
  border-radius: 16px; padding: 16px; background: var(--card); color: var(--ink);
}
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h3 { margin: 0; font-size: 20px; }
label { display: block; margin-bottom: 12px; font-weight: 600; font-size: 14px; color: var(--muted); }
input {
  display: block; width: 100%; margin-top: 4px; padding: 11px 12px; font: inherit; font-size: 16px;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
}
.hits { list-style: none; margin: 0; padding: 0; }
.hit { display: block; width: 100%; padding: 10px 0; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; }
.hit b { font-weight: 600; }
.hit span { display: block; color: var(--muted); font-size: 14px; }
.opts { margin-top: 8px; }
.opt { border-top: 1px solid var(--line); }
.opt-head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 0; background: none; border: 0; text-align: left; cursor: pointer; }
.opt-head .chips { display: flex; align-items: center; gap: 3px; flex: none; }
.opt-head .main { flex: 1; min-width: 0; }
.opt-head .times { display: block; white-space: nowrap; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.opt-head .note { display: block; }
.opt-head .count { flex: none; text-align: right; }
.opt-head .count small { display: block; color: var(--muted); font-size: 12px; }
.opt-head .count b { color: var(--accent); white-space: nowrap; }
.opt.open .opt-head .times::after { content: ' \25B4'; color: var(--muted); font-size: 14px; }
.opt:not(.open) .opt-head .times::after { content: ' \25BE'; color: var(--muted); font-size: 14px; }
.opt-body { padding: 4px 0 16px; }
.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 44px 14px minmax(0, 1fr); column-gap: 10px; }
.step .t { font-weight: 700; font-variant-numeric: tabular-nums; }
.step .rail { position: relative; }
.step .rail::before {
  content: ''; position: absolute; top: 6px; left: 1px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--card); border: 3px solid var(--muted); box-sizing: border-box; z-index: 1;
}
.step .rail::after { content: ''; position: absolute; top: 16px; bottom: -6px; left: 6px; width: 2px; }
.step.walk .rail::after { width: 0; border-left: 2px dotted var(--muted); }
.step.wait .rail::after { background: var(--line); }
.step.bus .rail::after { left: 5px; width: 4px; background: var(--leg, var(--accent)); }
.step.bus .rail::before { border-color: var(--leg, var(--accent)); }
.step.none .rail::after { display: none; }
.step .what { padding-bottom: 16px; }
.step .title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; }
.step .flag { margin-top: 2px; }
.via { margin-top: 4px; color: var(--muted); font-size: 14px; }
.via summary { cursor: pointer; color: var(--accent); font-weight: 600; }
.via ol { list-style: none; margin: 6px 0 0; padding: 0; }
.via li { padding: 2px 0; }
.via li span { display: inline-block; width: 44px; font-variant-numeric: tabular-nums; }
.more {
  width: 100%; margin-top: 4px; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 600;
  background: none; color: var(--accent); border: 1px solid var(--accent);
}
.more:disabled { opacity: .6; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Busje</h1>
    <p id="status" aria-live="polite">Locatie zoeken…</p>
  </header>

  <section>
    <div class="row"><h2>Wanneer?</h2></div>
    <div class="seg">
      <button id="modeNow" class="on">Nu</button>
      <button id="modeDepart">Vertrek om</button>
      <button id="modeBy">Aankomst tegen</button>
      <input id="by" type="time" aria-label="Tijd" hidden>
    </div>
  </section>

  <section>
    <div class="row"><h2>Waarheen?</h2><button id="edit" class="link">Aanpassen</button></div>
    <div id="places" class="grid"></div>
    <div class="free">
      <input id="free" placeholder="Of typ een plek, bv. Sportoase" aria-label="Plek zoeken" autocomplete="off" enterkeyhint="search">
      <ul id="freeHits" class="hits"></ul>
      <p id="freeMsg" class="note"></p>
    </div>
  </section>

  <section id="result" aria-live="polite" hidden></section>

  <section id="nearby" hidden>
    <div class="row"><h2>Haltes dichtbij</h2><button id="refresh" class="link">Vernieuw</button></div>
    <ul id="deps" class="deps"></ul>
  </section>

  <footer>Routes via Transitous, met data van De Lijn en OpenStreetMap. Geen officiële De Lijn-app. <span id="version"></span></footer>
</main>

<dialog id="add">
  <div class="row"><h3>Plek toevoegen</h3><button id="close" class="link">Sluiten</button></div>
  <label>Naam op de knop
    <input id="name" placeholder="bv. Gym" maxlength="24" autocomplete="off">
  </label>
  <label>Adres of plaats zoeken
    <input id="query" placeholder="bv. Gasthuisberg" autocomplete="off" enterkeyhint="search">
  </label>
  <p id="addMsg" class="note"></p>
  <ul id="hits" class="hits"></ul>
</dialog>

<script>
const APP_VERSION = '4';
const API = 'https://api.transitous.org/api';
const PHOTON = 'https://photon.komoot.io/api/';
const SEARCH_BOX = { south: 50.76, west: 4.52, north: 51.0, east: 4.88 };
const GYM_WORDS = /^(gym|gyms|fitness|fitnesscentrum|sportschool)$/i;
const GYM_QUERIES = ['fitness', 'gym', 'basic-fit', 'jims', 'anytime', 'fit'];
const MAX_HITS = 10;
const LEUVEN = { lat: 50.8798, lon: 4.7005 };
const LEUVEN_RADIUS_KM = 8;
const SEARCH_RADIUS_KM = 20;
const STORE_KEY = 'busje.places';
const DEFAULT_PLACES = [{ id: 'station', name: 'Station', lat: 50.8815, lon: 4.7157 }];
const RESULT_REFRESH_MS = 30000;
const NEARBY_REFRESH_MS = 60000;
const LATE_BUS_LOOKBACK_MS = 10 * 60000;
const LIVE_WINDOW_MS = 90 * 60000;
const REPLAN_AFTER_MS = 10 * 60000;
const IS_APPLE = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
const $ = id => document.getElementById(id);

// Oudere iPhones (iOS 13) kennen replaceChildren niet.
if (!Element.prototype.replaceChildren) {
  Element.prototype.replaceChildren = function (...kids) { this.textContent = ''; this.append(...kids); };
}

let places = loadPlaces();
let editing = false;
let mode = 'now';
let current = null;
let currentTrip = null;
let nearbyToken = 0;
let planToken = 0;
let updating = false;
let lastPos = null;

function loadPlaces() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    if (Array.isArray(saved)) return saved;
  } catch {}
  return DEFAULT_PLACES.slice();
}

function savePlaces() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(places)); } catch {}
}

function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === 'class') node.className = value;
    else if (key === 'data') Object.assign(node.dataset, value);
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
    else node[key] = value;
  }
  node.append(...kids.filter(kid => kid !== null && kid !== undefined));
  return node;
}

function distanceKm(a, b) {
  const rad = deg => deg * Math.PI / 180;
  const dLat = rad(b.lat - a.lat);
  const dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}

const ms = time => new Date(time).getTime();
const clock = time => new Date(time).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Brussels' });
const shortStop = name => (name || '').replace(/^Leuven /, '');
const minutes = seconds => Math.max(1, Math.round(seconds / 60));

function untilText(target) {
  const left = Math.floor((target - Date.now()) / 60000);
  if (left < 1) return null;
  return left < 60 ? `${left} min` : `${Math.floor(left / 60)} u ${left % 60} min`;
}

// AbortSignal.timeout bestaat pas sinds iOS 16; zonder dit faalde elke zoekopdracht op oudere iPhones.
function timeoutSignal(limit) {
  if (AbortSignal.timeout) return AbortSignal.timeout(limit);
  const controller = new AbortController();
  setTimeout(() => controller.abort(), limit);
  return controller.signal;
}

async function getJson(url, params) {
  const response = await fetch(`${url}?${new URLSearchParams(params)}`, { signal: timeoutSignal(20000) });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return response.json();
}

const api = (path, params) => getJson(`${API}/${path}`, params);

function locate(maxAge) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('geen locatie'));
    navigator.geolocation.getCurrentPosition(
      pos => {
        lastPos = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        resolve(lastPos);
      },
      reject,
      { enableHighAccuracy: true, timeout: 12000, maximumAge: maxAge }
    );
  });
}

function locationError(err) {
  if (!err || err.code !== 1) return 'Je locatie lukt even niet. Probeer het zo opnieuw.';
  return IS_APPLE
    ? 'Geen toegang tot je locatie. Zet dit aan via Instellingen > Privacy en beveiliging > Locatievoorzieningen > Safari-websites.'
    : 'Geen toegang tot je locatie. Geef je browser toegang via het slotje naast het adres, of via de instellingen van je gsm.';
}

const inLeuven = pos => distanceKm(pos, LEUVEN) <= LEUVEN_RADIUS_KM;
const NOT_IN_LEUVEN = 'Je bent niet in Leuven, dus ik zoek geen bussen.';

function chip(line) {
  const node = el('span', { class: 'chip', textContent: line.routeShortName || line.displayName || '?' });
  if (/^[0-9a-f]{6}$/i.test(line.routeColor || '')) node.style.background = `#${line.routeColor}`;
  if (/^[0-9a-f]{6}$/i.test(line.routeTextColor || '')) node.style.color = `#${line.routeTextColor}`;
  return node;
}

function renderPlaces() {
  const grid = $('places');
  grid.replaceChildren(
    ...places.map(place => el('button', {
      class: 'tile', onclick: event => editing ? removePlace(place) : go(place, event.currentTarget)
    }, place.name, editing ? el('span', { class: 'x', textContent: '✕' }) : null)),
    el('button', { class: 'tile add', onclick: openAdd, textContent: '+ Plek' })
  );
  $('edit').textContent = editing ? 'Klaar' : 'Aanpassen';
}

function removePlace(place) {
  if (!confirm(`${place.name} verwijderen?`)) return;
  places = places.filter(other => other.id !== place.id);
  savePlaces();
  renderPlaces();
}

function liveText(live) {
  if (!live) return 'volgens dienstregeling';
  const delay = Math.round((ms(live.dep) - ms(live.sched)) / 60000);
  if (delay >= 1) return `live: ${delay} min te laat`;
  if (delay <= -1) return `live: ${-delay} min vroeger`;
  return 'live: op tijd';
}

function defaultTime() {
  const now = new Date();
  if (mode === 'by') return `${String((now.getHours() + 1) % 24).padStart(2, '0')}:00`;
  const later = new Date(Math.ceil((now.getTime() + 15 * 60000) / 300000) * 300000);
  return `${String(later.getHours()).padStart(2, '0')}:${String(later.getMinutes()).padStart(2, '0')}`;
}

function pickedTime() {
  if (mode === 'now') return null;
  const [hour, minute] = ($('by').value || defaultTime()).split(':').map(Number);
  const target = new Date();
  target.setHours(hour, minute, 0, 0);
  const past = mode === 'by' ? target <= new Date() : target < Date.now() - 60 * 60000;
  if (past) target.setDate(target.getDate() + 1);
  return target;
}

const dayWord = time => new Date(time).toDateString() === new Date().toDateString() ? '' : 'morgen ';

const busLegs = option => option.legs.filter(leg => leg.mode === 'BUS');
const busTime = leg => ms(leg.live ? leg.live.dep : leg.startTime);
const busShift = leg => busTime(leg) - ms(leg.startTime);

async function addLive(legs) {
  const soon = Date.now() + LIVE_WINDOW_MS;
  const boards = new Map();
  await Promise.all(legs.map(async leg => {
    if (leg.realTime) leg.live = { dep: leg.startTime, sched: leg.scheduledStartTime };
    if (ms(leg.startTime) > soon) return;
    const stopId = leg.from.stopId;
    if (!boards.has(stopId)) boards.set(stopId, api('v5/stoptimes', { stopId, n: 15 }).catch(() => ({})));
    const match = ((await boards.get(stopId)).stopTimes || []).find(stop => stop.tripId === leg.tripId);
    if (!match) return;
    leg.cancelled = Boolean(match.cancelled || match.tripCancelled);
    if (match.realTime) leg.live = { dep: match.place.departure, sched: match.place.scheduledDeparture };
  }));
}

function summarize(option) {
  const buses = busLegs(option);
  const first = buses[0];
  const last = buses[buses.length - 1];
  return {
    buses,
    first,
    busAt: busTime(first),
    leaveAt: busTime(first) - (ms(first.startTime) - ms(option.startTime)),
    arriveAt: ms(option.endTime) + busShift(last),
    cancelled: buses.some(bus => bus.cancelled)
  };
}

// Een trip = alle opties die we al kennen voor één zoekvraag, plus de cursor om verder te bladeren.
async function plan(pos, place, openKey) {
  const when = pickedTime();
  const arriveBy = mode === 'by' ? when : null;
  const params = {
    fromPlace: `${pos.lat},${pos.lon}`,
    toPlace: `${place.lat},${place.lon}`,
    transitModes: 'BUS',
    numItineraries: 6,
    time: (when || new Date(Date.now() - LATE_BUS_LOOKBACK_MS)).toISOString()
  };
  if (arriveBy) params.arriveBy = true;
  const data = await api('v5/plan', params);
  const trip = {
    place, pos, params, arriveBy, openKey,
    departAt: mode === 'depart' ? when : null,
    items: new Map(),
    cursor: arriveBy ? data.previousPageCursor : data.nextPageCursor,
    userPaged: false,
    loadedAt: Date.now(),
    walk: arriveBy ? null : (data.direct || []).find(option => option.legs.length === 1)
  };
  await addItems(trip, data.itineraries);
  const shown = visibleOptions(trip).length;
  if (shown < 3) await morePages(trip, 3 - shown).catch(() => {});
  return trip;
}

async function addItems(trip, itineraries) {
  const fresh = [];
  for (const option of itineraries || []) {
    const buses = busLegs(option);
    if (!buses.length) continue;
    const key = buses[0].tripId;
    const old = trip.items.get(key);
    if (old && ms(old.endTime) <= ms(option.endTime)) continue;
    trip.items.set(key, option);
    fresh.push(option);
  }
  await addLive(fresh.flatMap(busLegs));
}

async function morePages(trip, wanted) {
  const before = visibleOptions(trip).length;
  for (let page = 0; page < 3 && trip.cursor; page++) {
    const data = await api('v5/plan', { ...trip.params, pageCursor: trip.cursor });
    trip.cursor = trip.arriveBy ? data.previousPageCursor : data.nextPageCursor;
    await addItems(trip, data.itineraries);
    if (visibleOptions(trip).length >= before + wanted) return;
  }
}

// Gooi opties weg die nergens goed voor zijn: vroeger vertrekken, niet vroeger aankomen, en niet minder overstappen.
function visibleOptions(trip) {
  const now = Date.now();
  const list = [...trip.items.entries()]
    .map(([key, option]) => ({ key, option, ...summarize(option) }))
    .filter(o => !o.cancelled && o.leaveAt >= now - 60000 && (!trip.arriveBy || o.arriveAt <= trip.arriveBy));
  const beats = (b, a) => b !== a && b.leaveAt >= a.leaveAt && b.arriveAt <= a.arriveAt && b.buses.length <= a.buses.length
    && (b.leaveAt > a.leaveAt || b.arriveAt < a.arriveAt || b.buses.length < a.buses.length);
  return list
    .filter(a => !list.some(b => beats(b, a)))
    .sort(trip.arriveBy ? (a, b) => b.busAt - a.busAt : (a, b) => a.busAt - b.busAt);
}

const googleNavigate = stop => `https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lon}&travelmode=walking&dir_action=navigate`;

function mapLinks(stop, trip) {
  const point = `${stop.lat},${stop.lon}`;
  const link = (text, href) => el('a', { href, target: '_blank', rel: 'noopener', textContent: text });
  return el('div', { class: 'links' },
    link('Halte in Google', googleNavigate(stop)),
    link('Halte in Apple', `https://maps.apple.com/?daddr=${point}&dirflg=w`),
    link('Hele route', `https://www.google.com/maps/dir/?api=1&origin=${trip.pos.lat},${trip.pos.lon}&destination=${trip.place.lat},${trip.place.lon}&travelmode=transit`)
  );
}

function updatedLine() {
  const time = new Date().toLocaleTimeString('nl-BE', { timeZone: 'Europe/Brussels' });
  return el('p', { id: 'updated', class: 'note updated', textContent: `Bijgewerkt om ${time}` });
}

function step({ time, title, lines = [], rail, color, flag, extra }) {
  const node = el('li', { class: `step ${rail}` },
    el('span', { class: 't', textContent: clock(time) }),
    el('span', { class: 'rail' }),
    el('div', { class: 'what' },
      el('div', { class: 'title' }, ...[].concat(title)),
      ...lines.filter(Boolean).map(text => el('div', { class: 'note', textContent: text })),
      flag ? el('div', { class: 'flag', textContent: flag }) : null,
      extra
    )
  );
  if (color) node.style.setProperty('--leg', color);
  return node;
}

const walkDistance = leg => leg.distance ? ` (${Math.round(leg.distance / 10) * 10} m)` : '';

function routeSteps(o, place, openStops) {
  const legs = o.option.legs;
  const steps = [];
  const firstWalk = legs[0].mode === 'WALK' && legs[0].duration >= 60 ? legs[0] : null;
  if (firstWalk) steps.push(step({
    time: o.leaveAt, rail: 'walk', title: 'Vertrekken',
    lines: [`Wandel ${minutes(firstWalk.duration)} min${walkDistance(firstWalk)} naar halte ${shortStop(o.first.from.name)}`]
  }));
  o.buses.forEach((bus, index) => {
    const shift = busShift(bus);
    const arrive = ms(bus.endTime) + shift;
    const via = bus.intermediateStops || [];
    const viaKey = `${o.key}|${index}`;
    const color = /^[0-9a-f]{6}$/i.test(bus.routeColor || '') ? `#${bus.routeColor}` : null;
    steps.push(step({
      time: busTime(bus), rail: 'bus', color,
      title: [chip(bus), bus.headsign ? `richting ${bus.headsign}` : 'bus'],
      lines: [`Opstappen aan ${shortStop(bus.from.name)}${bus.from.track ? `, perron ${bus.from.track}` : ''}`, liveText(bus.live)],
      extra: via.length ? el('details', { class: 'via', open: openStops.has(viaKey), data: { key: viaKey } },
        el('summary', { textContent: `${via.length + 1} haltes, ${minutes((ms(bus.endTime) - ms(bus.startTime)) / 1000)} min rijden` }),
        el('ol', {}, ...via.map(stop => el('li', {},
          el('span', { textContent: clock(ms(stop.arrival || stop.departure) + shift) }), shortStop(stop.name))))
      ) : null
    }));
    const next = o.buses[index + 1];
    const after = legs.slice(legs.indexOf(bus) + 1, next ? legs.indexOf(next) : legs.length);
    const walk = after.filter(leg => leg.mode === 'WALK').reduce((sum, leg) => sum + leg.duration, 0);
    if (next) {
      const wait = Math.round((busTime(next) - arrive) / 60000 - walk / 60);
      steps.push(step({
        time: arrive, rail: walk >= 60 ? 'walk' : 'wait', title: `Afstappen aan ${shortStop(bus.to.name)}`,
        lines: [walk >= 60
          ? `Wandel ${minutes(walk)} min naar ${shortStop(next.from.name)}, dan ${Math.max(0, wait)} min wachten`
          : `Overstappen, ${Math.max(0, wait)} min wachten`],
        flag: wait < 2 ? 'Krappe overstap.' : null
      }));
    } else {
      steps.push(step({
        time: arrive, rail: walk >= 60 ? 'walk' : 'none', title: `Afstappen aan ${shortStop(bus.to.name)}`,
        lines: [walk >= 60 ? `Wandel ${minutes(walk)} min naar ${place.name}` : null]
      }));
      if (walk >= 60) steps.push(step({ time: o.arriveAt, rail: 'none', title: `Aankomst: ${place.name}` }));
    }
  });
  return steps;
}

function optionView(o, trip, openStops) {
  const open = o.key === trip.openKey;
  const transfers = o.buses.length - 1;
  const head = el('button', {
    class: 'opt-head', ariaExpanded: String(open),
    onclick: () => { trip.openKey = open ? 'none' : o.key; renderTrip(); }
  },
    el('span', { class: 'chips' }, ...o.buses.map(chip)),
    el('span', { class: 'main' },
      el('span', { class: 'times', textContent: `${clock(o.busAt)} → ${clock(o.arriveAt)}` }),
      el('span', { class: 'note', textContent: [
        `${minutes((o.arriveAt - o.leaveAt) / 1000)} min`,
        transfers ? `${transfers} overstap${transfers > 1 ? 'pen' : ''}` : 'rechtstreeks',
        o.first.live ? liveText(o.first.live).replace('live: ', '') : null
      ].filter(Boolean).join(' · ') })
    ),
    el('span', { class: 'count' }, el('small', { textContent: 'vertrek' }), el('b', { data: { leave: o.leaveAt } }))
  );
  return el('div', { class: `opt${open ? ' open' : ''}` }, head,
    open ? el('div', { class: 'opt-body' },
      el('ol', { class: 'steps' }, ...routeSteps(o, trip.place, openStops)),
      mapLinks(o.first.from, trip)
    ) : null);
}

function renderTrip() {
  const trip = current && currentTrip;
  if (!trip) return;
  const section = $('result');
  section.hidden = false;
  const openStops = new Set([...section.querySelectorAll('details[open]')].map(node => node.dataset.key));
  const options = visibleOptions(trip);
  if (trip.openKey !== 'none' && !options.some(o => o.key === trip.openKey)) trip.openKey = options.length ? options[0].key : null;
  const when = trip.arriveBy ? `, ${dayWord(trip.arriveBy)}tegen ${clock(trip.arriveBy)}`
    : trip.departAt ? `, ${dayWord(trip.departAt)}vanaf ${clock(trip.departAt)}` : '';
  const fastest = Math.min(...options.map(o => o.arriveAt));
  const walkWins = trip.walk && !trip.departAt && Date.now() + trip.walk.duration * 1000 <= fastest;
  section.replaceChildren(el('div', { class: 'card' },
    el('h2', { textContent: `Naar ${trip.place.name}${when}` }),
    options.length ? null : el('p', { textContent: trip.arriveBy ? 'Ik vind geen bus die op tijd is.' : 'Ik vind geen bus.' }),
    walkWins ? el('p', { class: 'flag', textContent: `Te voet (${minutes(trip.walk.duration)} min) ben je er minstens even snel.` })
      : !options.length && trip.walk ? el('p', { class: 'note', textContent: `Te voet: ${minutes(trip.walk.duration)} min` }) : null,
    el('div', { class: 'opts' }, ...options.map(o => optionView(o, trip, openStops))),
    trip.cursor ? el('button', {
      class: 'more', textContent: trip.arriveBy ? 'Vroegere bussen' : 'Latere bussen',
      onclick: event => loadMore(trip, event.currentTarget)
    }) : null,
    updatedLine()
  ));
  tick();
}

async function loadMore(trip, button) {
  button.disabled = true;
  button.textContent = 'Laden…';
  try {
    await morePages(trip, 1);
    trip.userPaged = true;
    if (trip === currentTrip) renderTrip();
  } catch {
    if (trip !== currentTrip) return;
    button.disabled = false;
    button.textContent = 'Lukt even niet, tik om opnieuw te proberen';
  }
}

function renderMessage(text) {
  const section = $('result');
  section.hidden = false;
  section.replaceChildren(el('div', { class: 'card' }, el('p', { textContent: text })));
}

async function update(token, silent) {
  updating = true;
  try {
    const trip = currentTrip;
    if (silent && trip && trip.userPaged && Date.now() - trip.loadedAt < REPLAN_AFTER_MS) {
      // Je hebt zelf verder gebladerd: hou de lijst, vernieuw enkel de live tijden.
      await addLive([...trip.items.values()].flatMap(busLegs));
      if (token === planToken && trip === currentTrip) renderTrip();
      return;
    }
    const pos = await locate(silent ? 20000 : 15000);
    if (token !== planToken) return;
    if (!inLeuven(pos)) return renderMessage(NOT_IN_LEUVEN);
    const found = await plan(pos, current, silent && trip ? trip.openKey : null);
    if (token !== planToken) return;
    currentTrip = found;
    renderTrip();
    if (!silent) $('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (err) {
    if (token !== planToken) return;
    if (silent && $('updated')) {
      $('updated').textContent = 'Vernieuwen lukt even niet, dit is de laatste stand.';
    } else {
      renderMessage(err && err.code ? locationError(err) : 'De routedienst reageert even niet. Probeer het zo opnieuw.');
    }
  } finally {
    if (token === planToken) updating = false;
  }
}

async function go(place, tile) {
  current = place;
  currentTrip = null;
  const token = ++planToken;
  document.querySelectorAll('.tile.busy').forEach(other => other.classList.remove('busy'));
  if (tile) tile.classList.add('busy');
  renderMessage(`Bus naar ${place.name} zoeken…`);
  await update(token, false);
  if (tile) tile.classList.remove('busy');
}

function setMode(next) {
  if (mode === next) return;
  mode = next;
  $('modeNow').classList.toggle('on', mode === 'now');
  $('modeDepart').classList.toggle('on', mode === 'depart');
  $('modeBy').classList.toggle('on', mode === 'by');
  $('by').hidden = mode === 'now';
  $('by').setAttribute('aria-label', mode === 'by' ? 'Aankomen tegen' : 'Vertrekken om');
  if (mode !== 'now') $('by').value = defaultTime();
  if (current) go(current);
}

async function nearestStops(pos) {
  for (const size of [1, 3]) {
    const dLat = 0.005 * size;
    const dLon = 0.008 * size;
    const stops = await api('v1/map/stops', {
      max: `${pos.lat + dLat},${pos.lon + dLon}`,
      min: `${pos.lat - dLat},${pos.lon - dLon}`
    });
    const buses = stops
      .filter(stop => (stop.modes || []).includes('BUS') && stop.stopId)
      .map(stop => ({ ...stop, km: distanceKm(pos, stop) }))
      .sort((a, b) => a.km - b.km);
    if (buses.length) return buses.filter(stop => stop.km <= buses[0].km + 0.15).slice(0, 4);
  }
  return [];
}

async function loadNearby() {
  const mine = ++nearbyToken;
  let pos;
  try {
    pos = await locate(30000);
  } catch (err) {
    if (mine !== nearbyToken) return;
    $('status').textContent = locationError(err);
    $('nearby').hidden = true;
    return;
  }
  if (mine !== nearbyToken) return;
  if (!inLeuven(pos)) {
    $('status').textContent = NOT_IN_LEUVEN;
    $('nearby').hidden = true;
    return;
  }
  try {
    const stops = await nearestStops(pos);
    if (mine !== nearbyToken) return;
    if (!stops.length) {
      $('nearby').hidden = true;
      $('status').textContent = 'Geen bushalte gevonden in de buurt.';
      return;
    }
    $('status').textContent = `Dichtste halte: ${shortStop(stops[0].name)}, ${Math.round(stops[0].km * 1000)} m`;
    const results = await Promise.allSettled(stops.map(stop => api('v5/stoptimes', { stopId: stop.stopId, n: 5 })));
    if (mine !== nearbyToken) return;
    const now = Date.now();
    const seen = new Set();
    const departures = results
      .flatMap(result => result.status === 'fulfilled' ? result.value.stopTimes || [] : [])
      .filter(stop => !stop.cancelled && !stop.tripCancelled && ms(stop.place.departure) >= now - 30000)
      .filter(stop => !seen.has(stop.tripId) && seen.add(stop.tripId))
      .sort((a, b) => ms(a.place.departure) - ms(b.place.departure))
      .slice(0, 8);
    $('nearby').hidden = false;
    $('deps').replaceChildren(...(departures.length ? departures.map(stop => el('li', {}, el('a', { class: 'dep', href: googleNavigate(stop.place), target: '_blank', rel: 'noopener' },
      chip(stop),
      el('span', { class: 'to', textContent: stop.headsign || '' }),
      el('span', { class: 'when', data: { at: ms(stop.place.departure) } }),
      el('span', {
        class: 'note',
        textContent: `${shortStop(stop.place.name)}, ${clock(stop.place.departure)}, ${liveText(stop.realTime ? { dep: stop.place.departure, sched: stop.place.scheduledDeparture } : null)}`
      })
    ))) : [el('li', { class: 'note', textContent: 'Geen vertrekken gevonden.' })]));
    tick();
  } catch {
    if (mine === nearbyToken) $('status').textContent = 'De routedienst reageert even niet.';
  }
}

function tick() {
  document.querySelectorAll('[data-leave]').forEach(node => {
    const left = untilText(Number(node.dataset.leave));
    node.textContent = left ? `over ${left}` : 'nu';
  });
  document.querySelectorAll('[data-at]').forEach(node => {
    node.textContent = untilText(Number(node.dataset.at)) || 'nu';
  });
}

function openAdd() {
  $('name').value = '';
  $('query').value = '';
  $('hits').replaceChildren();
  $('addMsg').textContent = '';
  $('add').showModal();
}

function makeHit(title, street, place, lat, lon) {
  const join = parts => parts.filter(Boolean).join(' ');
  return { title, area: [join(street), join(place)].filter(Boolean).join(', '), lat, lon };
}

const fromHere = hit => distanceKm(lastPos || LEUVEN, hit);

async function searchGyms() {
  const results = await Promise.allSettled(GYM_QUERIES.map(query => searchPhoton(query, { osm_tag: 'leisure:fitness_centre' })));
  return results
    .flatMap(result => result.status === 'fulfilled' ? result.value : [])
    .sort((a, b) => fromHere(a) - fromHere(b));
}

async function searchPhoton(text, extra = {}) {
  const { south, west, north, east } = SEARCH_BOX;
  const data = await getJson(PHOTON, {
    q: text, lat: LEUVEN.lat, lon: LEUVEN.lon, limit: MAX_HITS, location_bias_scale: 0.1,
    bbox: `${west},${south},${east},${north}`, ...extra
  });
  return data.features.map(({ properties: p, geometry }) => {
    const street = [p.street, p.housenumber];
    return makeHit(p.name || street.filter(Boolean).join(' '), p.name ? street : [], [p.postcode, p.city],
      geometry.coordinates[1], geometry.coordinates[0]);
  }).filter(hit => hit.title);
}

async function searchTransitous(text) {
  const hits = await api('v1/geocode', { text, language: 'nl', place: `${LEUVEN.lat},${LEUVEN.lon}` });
  return hits.filter(hit => distanceKm(hit, LEUVEN) <= SEARCH_RADIUS_KM).map(hit => {
    const title = hit.type === 'ADDRESS' ? `${hit.street || hit.name} ${hit.houseNumber || ''}`.trim() : hit.name;
    const area = (hit.areas || []).find(item => item.default);
    return makeHit(title, [], [hit.zip, area && area.name], hit.lat, hit.lon);
  });
}

async function findPlaces(text) {
  for (const search of [GYM_WORDS.test(text) ? searchGyms : null, searchPhoton]) {
    if (!search) continue;
    try {
      const found = await search(text);
      if (found.length) return found;
    } catch {}
  }
  return searchTransitous(text);
}

function placeSearch(input, list, message, onPick) {
  let timer;
  let token = 0;
  async function run() {
    const text = input.value.trim();
    const mine = ++token;
    message.textContent = '';
    if (text.length < 3) return list.replaceChildren();
    message.textContent = 'Zoeken…';
    try {
      const found = await findPlaces(text);
      if (mine !== token) return;
      const seen = new Set();
      const unique = found.filter(hit => {
        const key = `${hit.title}|${hit.lat.toFixed(3)}|${hit.lon.toFixed(3)}`;
        return !seen.has(key) && seen.add(key);
      }).slice(0, MAX_HITS);
      message.textContent = unique.length ? '' : 'Niks gevonden rond Leuven.';
      list.replaceChildren(...unique.map(hit => el('li', {}, el('button', { class: 'hit', onclick: () => onPick(hit, hit.title) },
        el('b', { textContent: hit.title }),
        el('span', { textContent: [hit.area, `${fromHere(hit).toFixed(1).replace('.', ',')} km`].filter(Boolean).join(' · ') })
      ))));
    } catch {
      if (mine === token) message.textContent = 'Zoeken lukt even niet.';
    }
  }
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 300); });
}

placeSearch($('query'), $('hits'), $('addMsg'), (hit, title) => {
  const name = $('name').value.trim();
  if (!name) {
    $('addMsg').textContent = 'Geef eerst een naam op.';
    $('name').focus();
    return;
  }
  places.push({ id: String(Date.now()), name, lat: hit.lat, lon: hit.lon, address: title });
  savePlaces();
  renderPlaces();
  $('add').close();
});

placeSearch($('free'), $('freeHits'), $('freeMsg'), (hit, title) => {
  $('freeHits').replaceChildren();
  $('free').value = title;
  $('free').blur();
  go({ name: title, lat: hit.lat, lon: hit.lon });
});

$('edit').addEventListener('click', () => { editing = !editing; renderPlaces(); });
$('refresh').addEventListener('click', loadNearby);
$('close').addEventListener('click', () => $('add').close());
$('modeNow').addEventListener('click', () => setMode('now'));
$('modeDepart').addEventListener('click', () => setMode('depart'));
$('modeBy').addEventListener('click', () => setMode('by'));
$('by').addEventListener('change', () => { if (current && $('by').value) go(current); });
async function checkForUpdate() {
  try {
    const response = await fetch(`./?check=${Date.now()}`, { cache: 'no-store' });
    const latest = (await response.text()).match(/const APP_VERSION = '([^']+)'/)?.[1];
    if (latest && latest !== APP_VERSION && new URLSearchParams(location.search).get('v') !== latest) location.replace(`./?v=${latest}`);
  } catch {}
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  checkForUpdate();
  loadNearby();
  if (current && !updating) update(++planToken, true);
});
setInterval(tick, 15000);
setInterval(() => { if (!document.hidden && current && !updating) update(++planToken, true); }, RESULT_REFRESH_MS);
setInterval(() => { if (!document.hidden) loadNearby(); }, NEARBY_REFRESH_MS);

$('version').textContent = `Versie ${APP_VERSION}`;
renderPlaces();
loadNearby();
checkForUpdate();
</script>
</body>
